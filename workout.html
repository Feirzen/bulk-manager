<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#E9EAEC">
<title>Workout</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/app.css">
<style>
  .ex{border-bottom:1px solid var(--rule);padding:14px 0}
  .ex:last-of-type{border-bottom:0}
  .ex h3{font-size:14px;font-weight:600;display:flex;justify-content:space-between;align-items:baseline}
  .ex h3 em{font-style:normal;font-family:'IBM Plex Mono',monospace;font-size:10px;color:var(--ink-3);letter-spacing:.08em}
  .cue{font-size:11px;color:var(--ink-2);margin:3px 0 9px}
  .sets{display:flex;flex-direction:column;gap:6px}
  .set{display:grid;grid-template-columns:22px 1fr 1fr 1fr;gap:6px;align-items:center}
  .set span{font-family:'IBM Plex Mono',monospace;font-size:10px;color:var(--ink-3);text-align:center}
  .set input{
    width:100%;padding:9px 6px;border:1px solid var(--rule);border-radius:7px;
    font-family:'IBM Plex Mono',monospace;font-size:15px;text-align:center;
    background:var(--card);color:var(--ink);-webkit-appearance:none;
  }
  .set input:focus{outline:2px solid var(--signal);outline-offset:-1px;border-color:var(--signal)}
  .hdr{display:grid;grid-template-columns:22px 1fr 1fr 1fr;gap:6px;margin-bottom:5px}
  .hdr span{font-family:'IBM Plex Mono',monospace;font-size:9px;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-3);text-align:center}
  .swap{font-size:11px;color:var(--signal);background:none;border:0;padding:4px 0;cursor:pointer;font-family:inherit}
  .feel{display:flex;gap:6px;margin-top:8px}
  .feel button{flex:1;padding:11px;border:1px solid var(--rule);background:var(--card);border-radius:8px;font-family:inherit;font-size:13px;cursor:pointer;color:var(--ink)}
  .feel button.on{background:var(--ink);color:#fff;border-color:var(--ink)}
</style>
</head>
<body>

<div class="wrap">
  <header>
    <h1 id="title">Workout</h1>
    <span class="date" id="today"></span>
  </header>

  <div id="session"></div>

  <div class="card">
    <div class="eyebrow">How did it feel</div>
    <div class="feel" id="feel">
      <button data-f="rough">Rough</button>
      <button data-f="ok" class="on">OK</button>
      <button data-f="strong">Strong</button>
    </div>
  </div>

  <button class="action" id="copy">Copy workout results</button>
  <p style="font-size:11px;color:var(--ink-2);text-align:center;margin:10px 0 4px">
    Paste into Claude in the bulk project. Claude logs it and writes next week's program from it.
  </p>
</div>

<nav>
  <a href="index.html">Today</a>
  <a href="index.html">Nutrition</a>
  <a href="index.html">Exercise</a>
  <a href="workout.html" style="color:var(--signal)">Workout</a>
</nav>

<script src="assets/data.js"></script>
<script>
// PLACEHOLDER. Structure and the copy-out format are real and working.
// Layout and interaction are yours to rebuild in Claude Design.
let FEEL = 'ok';
let SESSION = null;

const SAMPLE = {
  title: 'Full Body A',
  exercises: [
    { name: 'Trap bar deadlift', scheme: '3 x 5', cue: 'Neutral spine, brace before the pull.', subs: ['Romanian deadlift', 'Leg press'], sets: 3 },
    { name: 'Incline dumbbell press', scheme: '3 x 8-10', cue: 'Stop 1-2 reps short.', subs: ['Machine chest press', 'Flat barbell bench'], sets: 3 },
    { name: 'Chest-supported row', scheme: '3 x 10', cue: 'Pull to the ribs, not the chest.', subs: ['Cable row', 'Lat pulldown'], sets: 3 },
    { name: 'Dead bug', scheme: '2 x 10/side', cue: 'Ribs down. Anti-lordosis work, do not rush it.', subs: ['Bird dog'], sets: 2 }
  ]
};

function render(s) {
  SESSION = s;
  document.getElementById('title').textContent = s.title;
  document.getElementById('session').innerHTML = s.exercises.map((ex, i) => `
    <div class="card">
      <div class="ex">
        <h3>${ex.name}<em>${ex.scheme}</em></h3>
        <div class="cue">${ex.cue}</div>
        <div class="hdr"><span></span><span>Weight</span><span>Reps</span><span>RPE</span></div>
        <div class="sets">
          ${[...Array(ex.sets)].map((_, j) => `
            <div class="set">
              <span>${j + 1}</span>
              <input inputmode="decimal" data-e="${i}" data-s="${j}" data-k="weight" placeholder="lb">
              <input inputmode="numeric" data-e="${i}" data-s="${j}" data-k="reps" placeholder="—">
              <input inputmode="decimal" data-e="${i}" data-s="${j}" data-k="rpe" placeholder="—">
            </div>`).join('')}
        </div>
        ${ex.subs.length ? `<button class="swap">If taken: ${ex.subs.join(' · ')}</button>` : ''}
      </div>
    </div>`).join('');
}

document.querySelectorAll('#feel button').forEach(b => b.onclick = () => {
  document.querySelectorAll('#feel button').forEach(x => x.classList.remove('on'));
  b.classList.add('on');
  FEEL = b.dataset.f;
});

document.getElementById('copy').onclick = async () => {
  const v = (e, s, k) => (document.querySelector(`[data-e="${e}"][data-s="${s}"][data-k="${k}"]`) || {}).value || '';
  let out = `WORKOUT LOG\n${isoDate(new Date())} · ${SESSION.title} · felt ${FEEL}\n\n`;
  SESSION.exercises.forEach((ex, i) => {
    const rows = [...Array(ex.sets)].map((_, j) => {
      const w = v(i, j, 'weight'), r = v(i, j, 'reps'), rpe = v(i, j, 'rpe');
      return (w || r) ? `  ${w || '?'} x ${r || '?'}${rpe ? ` @ RPE ${rpe}` : ''}` : null;
    }).filter(Boolean);
    if (rows.length) out += `${ex.name}\n${rows.join('\n')}\n\n`;
  });

  const btn = document.getElementById('copy');
  try {
    await navigator.clipboard.writeText(out.trim());
    btn.textContent = 'Copied. Paste into Claude.';
    btn.classList.add('done');
  } catch (e) {
    // Clipboard API needs a secure context and can be refused. Fall back to select-to-copy.
    const ta = document.createElement('textarea');
    ta.value = out.trim();
    ta.style.cssText = 'width:100%;height:220px;margin-top:10px;font-family:IBM Plex Mono,monospace;font-size:12px;padding:10px;border:1px solid var(--rule);border-radius:10px';
    btn.after(ta);
    ta.select();
    btn.textContent = 'Copy the text below';
  }
  setTimeout(() => { btn.textContent = 'Copy workout results'; btn.classList.remove('done'); }, 6000);
};

(async function () {
  document.getElementById('today').textContent = prettyDate(isoDate(new Date()));
  const prog = await load('data/workouts/program.json', {});
  const today = new Date().toLocaleDateString('en-US', { weekday: 'short' });
  const s = (prog.sessions || []).find(x => x.day === today);
  render(s || SAMPLE);
  if (!s) document.getElementById('title').insertAdjacentHTML('beforeend', ' <span class="flag">sample</span>');
})();
</script>
</body>
</html>
