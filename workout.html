<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Workout</title>
<link rel="icon" href="assets/icon.svg" type="image/svg+xml">
<link rel="icon" href="assets/favicon-32.png" sizes="32x32">
<link rel="apple-touch-icon" href="assets/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/app.css">
<script src="assets/theme.js"></script>
<style>
  /* ---- header + view switch ---- */
  .hrow{display:flex;justify-content:space-between;align-items:center;gap:10px}
  .views{display:flex;border:1px solid var(--rule);border-radius:8px;overflow:hidden;margin:10px 0 16px}
  .views button{
    flex:1;background:var(--card);border:0;border-right:1px solid var(--rule);
    padding:9px 4px;font-family:'IBM Plex Mono',monospace;font-size:10px;
    letter-spacing:.1em;text-transform:uppercase;color:var(--ink-3);cursor:pointer;
  }
  .views button:last-child{border-right:0}
  .views button.on{background:var(--ink);color:var(--paper)}
  .view{display:none}
  .view.on{display:block}

  /* ---- session banner ---- */
  .focus{font-size:12.5px;color:var(--ink-2);margin:0 0 12px;line-height:1.45}
  .banner{
    display:flex;align-items:center;gap:8px;margin:0 0 12px;padding:9px 11px;
    border-radius:8px;border:1px solid var(--rule);border-left:3px solid var(--signal);
    font-size:11.5px;color:var(--ink-2);line-height:1.4;
  }
  .banner button{
    margin-left:auto;flex:none;background:none;border:1px solid var(--rule);
    border-radius:6px;padding:5px 9px;font-family:'IBM Plex Mono',monospace;
    font-size:9.5px;letter-spacing:.08em;text-transform:uppercase;
    color:var(--ink-2);cursor:pointer;
  }

  /* ---- exercise card ---- */
  .exwrap{transition:opacity .18s ease, transform .18s ease}
  .exwrap.swapping{opacity:0;transform:translateY(8px)}
  .exhead{display:flex;justify-content:space-between;align-items:flex-start;gap:10px}
  .exname{font-size:16px;font-weight:600;line-height:1.25}
  .scheme{
    font-family:'IBM Plex Mono',monospace;font-size:15px;font-weight:600;
    color:var(--signal);white-space:nowrap;letter-spacing:-.01em;
  }
  .caret{
    background:none;border:1px solid var(--rule);border-radius:6px;
    width:30px;height:30px;flex:none;cursor:pointer;color:var(--ink-2);
    font-size:11px;line-height:1;font-family:inherit;
  }
  .caret.open{color:var(--signal);border-color:var(--signal)}
  .cue{font-size:12px;color:var(--ink-2);margin:6px 0 0}
  .perhand{
    display:inline-block;margin-top:7px;padding:3px 8px;border-radius:20px;
    background:var(--track);font-family:'IBM Plex Mono',monospace;font-size:9px;
    letter-spacing:.08em;text-transform:uppercase;color:var(--ink-3);
  }

  .detail{
    margin-top:11px;padding:12px;border-radius:8px;background:var(--track);
    font-size:12.5px;line-height:1.5;
  }
  .detail h4{
    font-family:'IBM Plex Mono',monospace;font-size:9px;letter-spacing:.12em;
    text-transform:uppercase;color:var(--ink-3);margin:0 0 5px;font-weight:500;
  }
  .detail h4+ol,.detail h4+ul{margin:0 0 11px 17px}
  .detail h4+p{margin:0 0 11px}
  .detail li{margin-bottom:3px}
  .detail ul li::marker{color:var(--over)}
  .detail > *:last-child{margin-bottom:0}

  /* muscle chips */
  .mus{display:flex;flex-wrap:wrap;gap:5px;margin:0 0 11px}
  .mus span{
    font-family:'IBM Plex Mono',monospace;font-size:9.5px;letter-spacing:.04em;
    padding:3px 7px;border-radius:20px;border:1px solid var(--rule);color:var(--ink-2);
  }
  .mus span.p{border-color:var(--signal);color:var(--signal);font-weight:600}

  /* substitution comparison */
  .vsbox{
    margin:0 0 11px;padding:9px 10px;border-radius:7px;
    border:1px solid var(--rule);border-left:3px solid var(--ink-3);
  }
  .vsbox.like{border-left-color:var(--d0)}
  .vsbox.close{border-left-color:var(--d2)}
  .vsbox.diff{border-left-color:var(--d4)}
  .vstag{
    font-family:'IBM Plex Mono',monospace;font-size:9px;letter-spacing:.1em;
    text-transform:uppercase;color:var(--ink-3);display:block;margin-bottom:3px;
  }

  /* Two public-domain stills, cross-faded. Reads as a clean loop without
     shipping a single GIF or leaning on anyone's licensed footage. */
  .demo{
    position:relative;width:100%;aspect-ratio:4/3;margin-bottom:12px;
    border-radius:7px;overflow:hidden;background:var(--card);
    border:1px solid var(--rule);
  }
  .demo img{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;display:block}
  .demo img.f1{animation:framecycle 3.2s steps(1,end) infinite}
  @keyframes framecycle{0%,50%{opacity:0}50.01%,100%{opacity:1}}
  .demo .cred{
    position:absolute;right:5px;bottom:4px;font-family:'IBM Plex Mono',monospace;
    font-size:8px;letter-spacing:.06em;color:var(--ink-3);opacity:.7;
  }

  .sugg{
    margin-top:11px;padding:9px 11px;border-radius:8px;
    border:1px solid var(--rule);border-left:3px solid var(--signal);
    font-size:12px;color:var(--ink-2);
  }
  .sugg b{color:var(--ink)}
  .sugg.cold{border-left-color:var(--ink-3)}

  /* ---- set logging ---- */
  .sets{margin-top:13px;display:flex;flex-direction:column;gap:12px}
  .set{border-top:1px solid var(--rule);padding-top:11px}
  .setrow{display:grid;grid-template-columns:26px 1fr auto 1fr;gap:8px;align-items:center}
  /* A hold has no weight and no rep count, so it gets one field and a unit. */
  .setrow.timed{grid-template-columns:26px 1fr auto}
  .setno{
    font-family:'IBM Plex Mono',monospace;font-size:13px;font-weight:600;
    color:var(--ink-3);text-align:center;
  }
  .setrow .x{font-family:'IBM Plex Mono',monospace;font-size:14px;color:var(--ink-3)}
  .setrow .unit{
    font-family:'IBM Plex Mono',monospace;font-size:13px;color:var(--ink-3);
    letter-spacing:.06em;padding-right:4px;
  }
  .set input{
    width:100%;padding:12px 6px;border:1px solid var(--rule);border-radius:8px;
    font-family:'IBM Plex Mono',monospace;font-size:19px;font-weight:600;text-align:center;
    background:var(--card);color:var(--ink);-webkit-appearance:none;
  }
  .set input:focus{outline:2px solid var(--signal);outline-offset:-1px;border-color:var(--signal)}
  .set input::placeholder{font-weight:400;font-size:14px;color:var(--ink-3)}

  .diff{display:grid;grid-template-columns:repeat(5,1fr);gap:5px;margin-top:8px}
  .diff button{
    padding:8px 2px;border:1px solid var(--rule);border-radius:7px;background:var(--card);
    font-family:'IBM Plex Mono',monospace;font-size:9.5px;
    color:var(--ink-3);cursor:pointer;
  }
  .diff button.on{color:#fff;font-weight:600}
  .diff button.on[data-d="0"]{background:var(--d0);border-color:var(--d0)}
  .diff button.on[data-d="1"]{background:var(--d1);border-color:var(--d1)}
  .diff button.on[data-d="2"]{background:var(--d2);border-color:var(--d2);color:#1A1A24}
  .diff button.on[data-d="3"]{background:var(--d3);border-color:var(--d3)}
  .diff button.on[data-d="4"]{background:var(--d4);border-color:var(--d4)}

  /* ---- favourite / dislike ---- */
  .rate{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:13px}
  .rate button{
    padding:9px 4px;border:1px solid var(--rule);border-radius:8px;background:var(--card);
    font-family:'IBM Plex Mono',monospace;font-size:9.5px;letter-spacing:.06em;
    text-transform:uppercase;color:var(--ink-3);cursor:pointer;
  }
  .rate button.on[data-v="1"]{background:var(--d0);border-color:var(--d0);color:#fff;font-weight:600}
  .rate button.on[data-v="-1"]{background:var(--d4);border-color:var(--d4);color:#fff;font-weight:600}
  .onfile{
    font-family:'IBM Plex Mono',monospace;font-size:9px;letter-spacing:.08em;
    text-transform:uppercase;color:var(--ink-3);margin-top:6px;display:block;
  }

  /* Both alternatives are always shown, including the original once you have
     swapped away from it, so a mis-tap is always one tap from undone. */
  .swaps{display:grid;grid-template-columns:1fr;gap:8px;margin-top:13px}
  .swap{
    padding:10px 11px;border:1px dashed var(--rule);border-radius:8px;
    background:none;color:var(--signal);cursor:pointer;text-align:left;
    font-family:inherit;font-size:11.5px;line-height:1.3;
  }
  .swap:active{background:var(--track)}
  .swap small{display:block;color:var(--ink-3);font-size:10.5px;line-height:1.4;margin-top:4px}
  .swaplabel{
    font-family:'IBM Plex Mono',monospace;font-size:9px;letter-spacing:.12em;
    text-transform:uppercase;color:var(--ink-3);margin-top:13px;display:block;
  }

  /* ---- notes + overall difficulty ---- */
  #notes{
    width:100%;margin-top:9px;padding:11px;border:1px solid var(--rule);
    border-radius:8px;background:var(--card);color:var(--ink);
    font-family:inherit;font-size:14px;line-height:1.45;min-height:82px;resize:vertical;
  }
  #notes:focus{outline:2px solid var(--signal);outline-offset:-1px;border-color:var(--signal)}
  #notes::placeholder{color:var(--ink-3)}

  .scale input[type=range]{width:100%;accent-color:var(--signal);margin:14px 0 4px}
  .scale-ends{
    display:flex;justify-content:space-between;
    font-family:'IBM Plex Mono',monospace;font-size:10px;
    letter-spacing:.1em;text-transform:uppercase;color:var(--ink-3);
  }
  .scale-now{text-align:center;font-size:20px;font-weight:600;margin-top:10px}

  .saved{
    text-align:center;font-family:'IBM Plex Mono',monospace;font-size:9.5px;
    letter-spacing:.1em;text-transform:uppercase;color:var(--ink-3);
    margin:12px 0 0;min-height:12px;transition:opacity .3s ease;
  }

  /* ---- week + past views ---- */
  .plain{padding:10px 0;border-bottom:1px solid var(--rule);font-size:13px}
  .plain:last-child{border-bottom:0;padding-bottom:0}
  .plain b{font-weight:600}
  .plain em{
    font-style:normal;font-family:'IBM Plex Mono',monospace;font-size:13px;
    color:var(--signal);font-weight:600;float:right;
  }
  .plain i{display:block;font-style:normal;font-size:11px;color:var(--ink-2);margin-top:2px}
  .plain u{
    display:block;text-decoration:none;font-family:'IBM Plex Mono',monospace;
    font-size:10px;color:var(--ink-3);margin-top:3px;
  }
  .hint{font-size:11px;color:var(--ink-2);text-align:center;margin:10px 0 4px}
  .addin{border-left:3px solid var(--burn)}
  .startbtn{
    display:block;width:100%;margin-top:13px;padding:11px;cursor:pointer;
    border:1px solid var(--signal);border-radius:8px;background:none;color:var(--signal);
    font-family:'IBM Plex Mono',monospace;font-size:10px;
    letter-spacing:.12em;text-transform:uppercase;
  }
  .startbtn:active{background:var(--track)}
  .startbtn.wip{border-style:dashed}
</style>
</head>
<body>

<div class="wrap">
  <header style="display:block;margin-bottom:0">
    <div class="hrow">
      <h1 id="title">Workout</h1>
      <span class="date" id="today"></span>
    </div>
    <div class="views">
      <button data-v="today" class="on">Today</button>
      <button data-v="week">This week</button>
      <button data-v="past">Past</button>
    </div>
  </header>

  <section class="view on" id="v-today">
    <div id="banner"></div>
    <p class="focus" id="focus" style="display:none"></p>
    <div id="session"></div>

    <div class="card" id="feelcard">
      <div class="eyebrow">Overall difficulty</div>
      <div class="scale">
        <input type="range" id="feel" min="1" max="5" step="1" value="3">
        <div class="scale-ends"><span>Rough</span><span>Easy</span></div>
        <div class="scale-now" id="feelnow">Solid</div>
      </div>
    </div>

    <div class="card" id="notecard">
      <div class="eyebrow">Notes, optional</div>
      <textarea id="notes" placeholder="Left knee cranky on lunges. Gym was packed, subbed the leg press."></textarea>
    </div>

    <button class="action" id="copy">Copy workout results</button>
    <p class="saved" id="savedmsg"></p>
    <p class="hint">Paste into Claude in the bulk project. Claude logs it and uses it to set next week.</p>
  </section>

  <section class="view" id="v-week"><div id="weeklist"></div></section>
  <section class="view" id="v-past"><div id="pastlist"></div></section>
</div>

<nav>
  <a href="index.html">Today</a>
  <a href="index.html#log">Log</a>
  <a href="workout.html" class="on">Workout</a>
</nav>

<script src="assets/data.js"></script>
<script src="assets/exercises.js"></script>
<script src="assets/exercise-images.js"></script>
<script src="assets/exercise-knowledge.js"></script>
<script>
// Difficulty scale. Index 0-4 maps to RPE 6-10 so the stored shape stays
// compatible with LOGGING-SPEC and with anything already logged.
const DIFF      = ['Easy', 'Mod', 'Hard', 'V.Hard', 'Max'];
const DIFF_WORD = ['easy', 'moderate', 'hard', 'very hard', 'max'];
const OVERALL   = ['rough', 'tough', 'solid', 'good', 'easy'];
const diffToRpe = i => i + 6;

const KNOW = (typeof EX_KNOW !== 'undefined') ? EX_KNOW : {};

// Held one in each hand, so the logged number is per hand, not the pair.
// A lunge logged as 30 means two 30s. Keeps load_step honest: the next jump
// up is one 5 lb dumbbell, not a 5 lb change spread across both.
const PER_HAND = new Set([
  'Dumbbell bench press', 'Incline dumbbell press', 'Overhead dumbbell press',
  'Dumbbell curl', 'Hammer curl', 'Walking lunge', 'Bulgarian split squat',
  'Rear delt dumbbell fly', 'Dumbbell lateral raise', 'Farmer carry'
]);

// ---------- timed exercises ----------
// A plank is measured in seconds. Asking for a weight and a rep count on one
// is noise, so these get a single seconds field instead.
const TIMED = new Set([
  'Plank', 'Side plank', 'Couch stretch', 'Wall sit', 'Dead hang',
  'Farmer carry', 'Hollow body hold', 'Bear crawl hold'
]);

// Name decides, not the scheme. Otherwise swapping Plank out for Pallof press
// would leave the seconds field in place because the scheme still says 30-45s.
// The scheme is only a fallback for a name with no entry in exercises.js.
function isTimed(name, scheme) {
  if (TIMED.has(name)) return true;
  if (typeof EXERCISES !== 'undefined' && EXERCISES[name]) return false;
  return !!scheme && /\d\s*(?:s|sec|secs|seconds)\b/i.test(scheme);
}

// Pulls the target hold out of a scheme like "3 x 30-45s" for the placeholder.
function schemeSeconds(scheme) {
  const m = String(scheme || '').match(/(\d+)\s*(?:s|sec|secs|seconds)\b/i);
  return m ? m[1] : null;
}

let PROG        = {};      // the whole program file
let SESSION     = null;    // { title, exercises: [...] }
let SESSION_KEY = null;    // A / B / C / P / S. Keys the autosave slot
let HISTORY     = [];      // past logged sessions, any month
let PICK        = [];      // per-exercise: active option in [main, ...subs]
let VALUES      = [];      // per-exercise, per-set: { w, r, t, d }
let OPEN        = [];      // per-exercise: detail panel expanded
let FEEL        = 3;
let RATINGS     = {};      // name -> 1 | -1 | 0, this device
let ON_FILE     = {};      // name -> 'favorite' | 'disliked', from the repo

const esc = s => String(s == null ? '' : s)
  .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');

// ---------- view switching ----------
document.querySelectorAll('.views button').forEach(b => b.onclick = () => {
  document.querySelectorAll('.views button').forEach(x => x.classList.toggle('on', x === b));
  document.querySelectorAll('.view').forEach(x => x.classList.toggle('on', x.id === 'v-' + b.dataset.v));
  window.scrollTo(0, 0);
});
const showToday = () => document.querySelector('.views button[data-v="today"]').click();

/* ============================================================
   AUTOSAVE
   The whole reason this exists: iOS evicts a background tab and
   reloads it on return, which used to wipe everything typed. Now
   every keystroke, difficulty tap and swap is mirrored to device
   storage and restored on load. Slot is keyed by date and session,
   so two sessions on one day never overwrite each other. Slots
   older than three days are swept on boot.
   ============================================================ */
const WIP_PREFIX = 'bm.wip.';
const RATE_KEY   = 'bm.ratings';
const DAY_MS     = 86400000;

function wipKey() { return WIP_PREFIX + isoDate(new Date()) + '.' + (SESSION_KEY || 'x'); }

let saveTimer = null;
function flashSaved() {
  const el = document.getElementById('savedmsg');
  if (!el) return;
  el.textContent = 'Saved on this device';
  el.style.opacity = '1';
  clearTimeout(saveTimer);
  saveTimer = setTimeout(() => { el.style.opacity = '0'; }, 1400);
}

function saveWip(quiet) {
  if (!SESSION) return;
  try {
    const notesEl = document.getElementById('notes');
    localStorage.setItem(wipKey(), JSON.stringify({
      v: VALUES, p: PICK, f: FEEL,
      n: notesEl ? notesEl.value : '',
      t: Date.now()
    }));
    if (!quiet) flashSaved();
  } catch (e) { /* private mode or storage full. Logging still works. */ }
}

function loadWip() {
  try {
    const raw = localStorage.getItem(wipKey());
    if (!raw) return false;
    const d = JSON.parse(raw);
    if (!d || !Array.isArray(d.v) || d.v.length !== VALUES.length) return false;
    // Only restore if something was actually entered. An empty slot is noise.
    const touched = d.v.some(sets => (sets || []).some(s =>
      s && (s.w || s.r || s.t || s.d != null)));
    VALUES = d.v;
    if (Array.isArray(d.p) && d.p.length === PICK.length) PICK = d.p;
    if (typeof d.f === 'number') FEEL = d.f;
    const notesEl = document.getElementById('notes');
    if (notesEl && d.n) notesEl.value = d.n;
    return touched;
  } catch (e) { return false; }
}

function clearWip() {
  try { localStorage.removeItem(wipKey()); } catch (e) {}
}

function sweepWip() {
  try {
    const cutoff = Date.now() - 3 * DAY_MS;
    for (let i = localStorage.length - 1; i >= 0; i--) {
      const k = localStorage.key(i);
      if (!k || k.indexOf(WIP_PREFIX) !== 0) continue;
      let t = 0;
      try { t = (JSON.parse(localStorage.getItem(k)) || {}).t || 0; } catch (e) {}
      if (t < cutoff) localStorage.removeItem(k);
    }
  } catch (e) {}
}

// Does a given session key have unsent work saved for today?
function wipExists(key) {
  try {
    const raw = localStorage.getItem(WIP_PREFIX + isoDate(new Date()) + '.' + key);
    if (!raw) return false;
    const d = JSON.parse(raw);
    return !!(d && Array.isArray(d.v) && d.v.some(sets => (sets || []).some(s =>
      s && (s.w || s.r || s.t || s.d != null))));
  } catch (e) { return false; }
}

// Belt and braces. iOS kills tabs without warning, so mirror on the way out too.
window.addEventListener('pagehide', () => saveWip(true));
document.addEventListener('visibilitychange', () => {
  if (document.visibilityState === 'hidden') saveWip(true);
});

// ---------- ratings ----------
// A rating already saved in the repo shows as selected, so a favourite marked
// weeks ago is still visibly marked next time that exercise comes up. A local
// tap overrides it, including tapping the lit button again to clear it, which
// stores an explicit 0 rather than deleting the key. Deleting would just let
// the filed value reappear and make the clear look broken.
const hasLocal = name => Object.prototype.hasOwnProperty.call(RATINGS, name);
function effRating(name) {
  if (hasLocal(name)) return RATINGS[name];
  return ON_FILE[name] === 'favorite' ? 1 : ON_FILE[name] === 'disliked' ? -1 : 0;
}

function loadRatings() {
  try { RATINGS = JSON.parse(localStorage.getItem(RATE_KEY) || '{}') || {}; }
  catch (e) { RATINGS = {}; }
}
function saveRatings() {
  try { localStorage.setItem(RATE_KEY, JSON.stringify(RATINGS)); } catch (e) {}
}

// ---------- progression ----------
// Looks up the last time this exercise was logged and turns the recorded
// difficulty into a concrete instruction. No history means no number, on
// purpose. Guessing a starting weight would be worse than leaving it blank.
function suggestion(name, timed) {
  const past = HISTORY
    .filter(s => (s.exercises || []).some(e => e.name === name))
    .sort((a, b) => String(b.date).localeCompare(String(a.date)));

  if (!past.length) return null;

  const sess = past[0];
  const ex   = sess.exercises.find(e => e.name === name);
  const all  = ex.sets || [];

  const rpeAvg = list => {
    const r = list.map(s => s.rpe).filter(x => typeof x === 'number');
    return r.length ? r.reduce((a, b) => a + b, 0) / r.length : null;
  };

  // Holds progress on time, not on load. Same RPE bands, different lever.
  if (timed) {
    const held = all.filter(s => s && typeof s.duration_s === 'number');
    if (!held.length) return null;

    const best = held.reduce((a, b) => (b.duration_s > a.duration_s ? b : a)).duration_s;
    const avg  = rpeAvg(held);
    const last = held.map(s => s.duration_s + 's').join(', ');

    let advice, target = best;
    if (avg == null) {
      advice = 'Repeat it and log the difficulty this time.';
    } else if (avg <= 7) {
      target = best + 10;
      advice = `Held it easily. Go for <b>${target}s</b>.`;
    } else if (avg <= 8) {
      advice = `Hold <b>${best}s</b> again, add a few seconds if the position stays clean.`;
    } else if (avg <= 9) {
      advice = `Repeat <b>${best}s</b>.`;
    } else {
      target = Math.max(10, Math.round((best * 0.85) / 5) * 5);
      advice = `Was maxed out. Drop to <b>${target}s</b> and keep the position honest.`;
    }
    return { date: sess.date, last, advice, target };
  }

  const sets = all.filter(s => s && (s.weight_lb != null || s.reps != null));
  if (!sets.length) return null;

  const weighted = sets.filter(s => typeof s.weight_lb === 'number' && s.weight_lb > 0);
  const top  = weighted.length
    ? weighted.reduce((a, b) => (b.weight_lb > a.weight_lb ? b : a))
    : sets[0];
  const avg  = rpeAvg(sets);
  const step = (EXERCISES[name] || {}).load_step;
  const bw   = step === 0;

  const last = sets.map(s =>
    `${s.weight_lb ? s.weight_lb + ' x ' : ''}${s.reps != null ? s.reps : '?'}`).join(', ');

  let advice, target = null;

  if (avg == null) {
    advice = 'Repeat it and log the difficulty this time.';
    target = top.weight_lb || null;
  } else if (bw) {
    advice = avg <= 7 ? 'Add reps or slow the tempo down.'
           : avg <= 9 ? 'Repeat the same reps.'
           : 'Cut the reps back a little.';
  } else if (avg <= 7) {
    target = (top.weight_lb || 0) + (step || 5);
    advice = `Went easy. Move up to <b>${target} lb</b>.`;
  } else if (avg <= 8) {
    target = top.weight_lb;
    advice = `Same <b>${target} lb</b>, chase one more rep per set.`;
  } else if (avg <= 9) {
    target = top.weight_lb;
    advice = `Repeat <b>${target} lb</b> and clean it up.`;
  } else {
    target = top.weight_lb;
    advice = `Was maxed out. Hold at <b>${target} lb</b> or back off five percent.`;
  }

  return { date: sess.date, last, advice, target };
}

// ---------- exercise card ----------
function options(i) {
  const base = SESSION.exercises[i];
  return [base.name].concat(base.subs || []);
}
function currentName(i) {
  return options(i)[PICK[i]];
}
function currentTimed(i) {
  return isTimed(currentName(i), SESSION.exercises[i].scheme);
}

function demoHtml(name) {
  const id = EX_IMG[name];
  if (!id) return '';
  return `<div class="demo">
    <img src="${EX_IMG_BASE}${id}/0.jpg" alt="" loading="lazy">
    <img class="f1" src="${EX_IMG_BASE}${id}/1.jpg" alt="" loading="lazy">
    <span class="cred">free-exercise-db</span>
  </div>`;
}

// What it trains, and where you should feel it. Skipped silently when the
// exercise has no entry yet rather than printing an empty heading.
function knowHtml(name) {
  const k = KNOW[name];
  if (!k) return '';
  let out = '';
  if (k.targets) {
    const prim = (k.targets.primary || []).map(m => `<span class="p">${esc(m)}</span>`);
    const sec  = (k.targets.secondary || []).map(m => `<span>${esc(m)}</span>`);
    if (prim.length || sec.length) {
      out += `<h4>What it trains</h4><div class="mus">${prim.concat(sec).join('')}</div>`;
    }
  }
  if (k.feel) out += `<h4>Where you should feel it</h4><p>${esc(k.feel)}</p>`;
  return out;
}

const VS_LABEL = { like: 'Straight swap', close: 'Close, with a difference', diff: 'Trains something else' };

// Pulls the comparison between the programmed exercise and whatever is
// currently selected in its place.
function vsEntry(i, name) {
  const base = SESSION.exercises[i];
  if (name === base.name) return null;
  const k = KNOW[base.name];
  if (!k || !k.vs || !k.vs[name]) return null;
  return k.vs[name];
}

function vsHtml(i, name) {
  const e = vsEntry(i, name);
  if (!e) return '';
  return `<div class="vsbox ${esc(e.v)}">
    <span class="vstag">vs ${esc(SESSION.exercises[i].name)} &middot; ${esc(VS_LABEL[e.v] || '')}</span>
    ${esc(e.n)}
  </div>`;
}

function exCard(i) {
  const base  = SESSION.exercises[i];
  const name  = currentName(i);
  const timed = isTimed(name, base.scheme);
  const ref   = EXERCISES[name] || null;
  const sug   = suggestion(name, timed);
  const opts  = options(i);

  let detail = '';
  if (OPEN[i]) {
    const body = ref
      ? `<h4>How to do it</h4>
         <ol>${ref.form.map(f => `<li>${esc(f)}</li>`).join('')}</ol>
         <h4>Common errors</h4>
         <ul>${ref.errors.map(f => `<li>${esc(f)}</li>`).join('')}</ul>`
      : 'No form notes saved for this one yet. Ask Claude to add it.';
    detail = `<div class="detail">
      ${demoHtml(name)}
      ${vsHtml(i, name)}
      ${knowHtml(name)}
      ${body}
    </div>`;
  }

  const coldMsg = timed
    ? 'No history yet. Hold until the position starts to break, then stop and log how it felt.'
    : 'No history yet. Pick a weight you could stop two reps short of, and log how it felt.';

  const sugHtml = sug
    ? `<div class="sugg"><b>${prettyDate(sug.date)}:</b> ${esc(sug.last)}<br>${sug.advice}</div>`
    : `<div class="sugg cold">${coldMsg}</div>`;

  const setsHtml = [...Array(base.sets)].map((_, j) => {
    const v = VALUES[i][j];
    const diff = `<div class="diff">
        ${DIFF.map((d, k) => `<button data-e="${i}" data-s="${j}" data-d="${k}"${v.d === k ? ' class="on"' : ''}>${d}</button>`).join('')}
      </div>`;

    if (timed) {
      const ph = (sug && sug.target) || schemeSeconds(base.scheme) || 'sec';
      return `<div class="set">
        <div class="setrow timed">
          <div class="setno">${j + 1}</div>
          <input inputmode="numeric" placeholder="${esc(ph)}" value="${esc(v.t)}" data-e="${i}" data-s="${j}" data-k="t">
          <div class="unit">sec</div>
        </div>
        ${diff}
      </div>`;
    }

    const ph = sug && sug.target ? String(sug.target) : 'lb';
    return `<div class="set">
      <div class="setrow">
        <div class="setno">${j + 1}</div>
        <input inputmode="decimal" placeholder="${ph}" value="${esc(v.w)}" data-e="${i}" data-s="${j}" data-k="w">
        <div class="x">x</div>
        <input inputmode="numeric" placeholder="reps" value="${esc(v.r)}" data-e="${i}" data-s="${j}" data-k="r">
      </div>
      ${diff}
    </div>`;
  }).join('');

  // Ratings ride along in the copied block rather than posting anywhere. The
  // site is static, so there is nothing to post to without shipping a token.
  const r = effRating(name);
  const filed = !hasLocal(name) && ON_FILE[name];
  const rateHtml = `<div class="rate">
      <button data-rate="${i}" data-v="1"${r === 1 ? ' class="on"' : ''}>&#9829; More of this</button>
      <button data-rate="${i}" data-v="-1"${r === -1 ? ' class="on"' : ''}>&#10005; Less of this</button>
    </div>${filed ? `<span class="onfile">Already marked ${esc(filed)}</span>` : ''}`;

  const alts = opts.map((o, k) => {
    if (k === PICK[i]) return '';
    const e = k === 0 ? null : (KNOW[base.name] || {}).vs && (KNOW[base.name] || {}).vs[o];
    const note = k === 0 ? 'Back to what was programmed.' : (e ? e.n : '');
    return `<button class="swap" data-swap="${i}" data-opt="${k}">&#8646; ${esc(o)}${note ? `<small>${esc(note)}</small>` : ''}</button>`;
  }).join('');

  return `<div class="card exwrap" data-card="${i}">
    <div class="exhead">
      <div style="flex:1;min-width:0">
        <div class="exname">${esc(name)}${PICK[i] !== 0 ? ' <span class="flag">swapped</span>' : ''}</div>
      </div>
      <div class="scheme">${esc(base.scheme)}</div>
      <button class="caret${OPEN[i] ? ' open' : ''}" data-caret="${i}" aria-label="Form, targets and common errors">${OPEN[i] ? '&#9650;' : '&#9660;'}</button>
    </div>
    <div class="cue">${esc(base.cue)}</div>
    ${PER_HAND.has(name) ? '<span class="perhand">Log the weight of one dumbbell, not the pair</span>' : ''}
    ${detail}
    ${sugHtml}
    <div class="sets">${setsHtml}</div>
    ${rateHtml}
    ${alts ? `<span class="swaplabel">Swap for</span><div class="swaps">${alts}</div>` : ''}
  </div>`;
}

function renderSession() {
  document.getElementById('session').innerHTML =
    SESSION.exercises.map((_, i) => exCard(i)).join('');
  wire();
}

// Re-render one card with a short fade so the swap reads as a swap. Sets you
// have already entered survive it: VALUES is never touched here, and exCard
// paints straight back out of it. A mis-tap costs nothing.
function repaint(i, animate) {
  const el = document.querySelector(`[data-card="${i}"]`);
  if (!el) return;
  if (!animate) {
    el.outerHTML = exCard(i);
    wire();
    return;
  }
  el.classList.add('swapping');
  setTimeout(() => {
    el.outerHTML = exCard(i);
    const fresh = document.querySelector(`[data-card="${i}"]`);
    fresh.classList.add('swapping');
    wire();
    requestAnimationFrame(() => requestAnimationFrame(() =>
      fresh.classList.remove('swapping')));
  }, 190);
}

function wire() {
  document.querySelectorAll('[data-caret]').forEach(b => b.onclick = () => {
    const i = +b.dataset.caret;
    OPEN[i] = !OPEN[i];
    repaint(i, false);
  });

  document.querySelectorAll('[data-swap]').forEach(b => b.onclick = () => {
    const i = +b.dataset.swap;
    PICK[i] = +b.dataset.opt;
    saveWip(true);
    repaint(i, true);
  });

  document.querySelectorAll('.set input').forEach(inp => inp.oninput = () => {
    VALUES[+inp.dataset.e][+inp.dataset.s][inp.dataset.k] = inp.value;
    saveWip();
  });

  document.querySelectorAll('.diff button').forEach(b => b.onclick = () => {
    const i = +b.dataset.e, j = +b.dataset.s, d = +b.dataset.d;
    VALUES[i][j].d = VALUES[i][j].d === d ? null : d;
    b.parentElement.querySelectorAll('button').forEach(x =>
      x.classList.toggle('on', +x.dataset.d === VALUES[i][j].d));
    saveWip();
  });

  document.querySelectorAll('[data-rate]').forEach(b => b.onclick = () => {
    const i = +b.dataset.rate, v = +b.dataset.v;
    const name = currentName(i);
    RATINGS[name] = (effRating(name) === v) ? 0 : v;
    saveRatings();
    repaint(i, false);
  });
}

// ---------- overall difficulty ----------
const feelEl = document.getElementById('feel');
feelEl.oninput = () => {
  FEEL = +feelEl.value;
  const w = OVERALL[FEEL - 1];
  document.getElementById('feelnow').textContent = w[0].toUpperCase() + w.slice(1);
  saveWip();
};
document.getElementById('notes').oninput = () => saveWip();

function paintFeel() {
  feelEl.value = FEEL;
  const w = OVERALL[FEEL - 1];
  document.getElementById('feelnow').textContent = w[0].toUpperCase() + w.slice(1);
}

// ---------- copy out ----------
// A timed set writes "45s @ hard (RPE 8)". A loaded set keeps the existing
// "185 x 8 @ hard (RPE 8)" shape, so old blocks still parse the same way.
document.getElementById('copy').onclick = async () => {
  let out = `WORKOUT LOG\n${isoDate(new Date())} · ${SESSION.title} · overall: ${OVERALL[FEEL - 1]}\n\n`;

  SESSION.exercises.forEach((base, i) => {
    const timed = currentTimed(i);
    const rows = VALUES[i].map(v => {
      const d = v.d != null ? ` @ ${DIFF_WORD[v.d]} (RPE ${diffToRpe(v.d)})` : '';
      if (timed) {
        if (!v.t) return null;
        return `  ${v.t}s${d}`;
      }
      if (!v.w && !v.r) return null;
      return `  ${v.w || 'bw'} x ${v.r || '?'}${d}`;
    }).filter(Boolean);
    if (rows.length) out += `${currentName(i)}\n${rows.join('\n')}\n\n`;
  });

  // Only ratings that differ from what the repo already knows. Re-sending
  // "favorite" every session would be noise. A tilde clears one.
  const mark = { 1: 'favorite', '-1': 'disliked', 0: null };
  const sending = Object.keys(RATINGS).filter(n => (ON_FILE[n] || null) !== mark[RATINGS[n]]);
  if (sending.length) {
    const sign = v => (v === 1 ? '+' : v === -1 ? '-' : '~');
    out += `RATINGS: ${sending.map(n => sign(RATINGS[n]) + n).join(', ')}\n\n`;
  }

  const notes = document.getElementById('notes').value.trim();
  if (notes) out += `Notes: ${notes}\n`;

  const btn = document.getElementById('copy');
  const text = out.trim();
  try {
    await navigator.clipboard.writeText(text);
    btn.textContent = 'Copied. Paste into Claude.';
    btn.classList.add('done');
  } catch (e) {
    // Clipboard API needs a secure context and can be refused. Fall back to
    // a textarea the OS can copy from.
    const ta = document.createElement('textarea');
    ta.value = text;
    ta.style.cssText = 'width:100%;height:220px;margin-top:10px;font-family:IBM Plex Mono,monospace;font-size:12px;padding:10px;border:1px solid var(--rule);border-radius:10px;background:var(--card);color:var(--ink)';
    btn.after(ta);
    ta.select();
    btn.textContent = 'Copy the text below';
  }
  setTimeout(() => { btn.textContent = 'Copy workout results'; btn.classList.remove('done'); }, 6000);
};

/* ============================================================
   STARTING A SESSION
   Any session can be opened and logged, not just the one whose
   day it happens to be. Optional add-ins included, which is the
   whole point on an off day.
   ============================================================ */
function startSession(s, offDay) {
  SESSION     = s;
  SESSION_KEY = s.key || s.day || 'x';
  PICK   = s.exercises.map(() => 0);
  OPEN   = s.exercises.map(() => false);
  VALUES = s.exercises.map(ex => [...Array(ex.sets)].map(() => ({ w: '', r: '', t: '', d: null })));
  FEEL   = 3;
  document.getElementById('notes').value = '';

  const restored = loadWip();
  paintFeel();

  document.getElementById('title').textContent = s.title;
  document.getElementById('feelcard').style.display = '';
  document.getElementById('notecard').style.display = '';
  document.getElementById('copy').style.display = '';

  const focusEl = document.getElementById('focus');
  if (s.focus) { focusEl.textContent = s.focus; focusEl.style.display = ''; }
  else focusEl.style.display = 'none';

  const bits = [];
  if (restored) bits.push('Picked up where you left off. Everything you typed is still here.');
  else if (offDay) bits.push(`Not a lift day. This is <b>${esc(s.day || 'an add-in')}</b>, opened early.`);
  else if (s.when) bits.push(esc(s.when));

  document.getElementById('banner').innerHTML = bits.length
    ? `<div class="banner">${bits.join(' ')}${restored ? '<button id="clearwip">Start over</button>' : ''}</div>`
    : '';

  const clr = document.getElementById('clearwip');
  if (clr) clr.onclick = () => { clearWip(); startSession(s, offDay); };

  renderSession();
  renderWeek(PROG);
  window.scrollTo(0, 0);
}

// ---------- week + past views ----------
function plainSession(s, addin) {
  const rows = (s.exercises || []).map(e => `<div class="plain">
    <em>${esc(e.scheme)}</em><b>${esc(e.name)}</b>
    <i>${esc(e.cue)}</i>
    ${(e.subs || []).length ? `<u>or ${e.subs.map(esc).join(' · ')}</u>` : ''}
  </div>`).join('');
  const key  = s.key || s.day;
  const wip  = key && wipExists(key);
  const live = SESSION_KEY && key === SESSION_KEY;
  return `<div class="card${addin ? ' addin' : ''}">
    <div class="eyebrow">${esc(addin ? s.when : s.day)}</div>
    <h2 style="margin:5px 0 6px;font-size:15px">${esc(s.title)}</h2>
    ${s.focus ? `<p class="focus" style="margin:0 0 8px">${esc(s.focus)}</p>` : ''}
    ${rows}
    ${key ? `<button class="startbtn${wip ? ' wip' : ''}" data-start="${esc(key)}">${
      live ? 'Open again' : wip ? 'Resume this session' : 'Do this session'
    }</button>` : ''}
  </div>`;
}

function renderWeek(prog) {
  const el = document.getElementById('weeklist');
  const sessions = prog.sessions || [], addins = prog.optional_addins || [];
  if (!sessions.length) {
    el.innerHTML = '<div class="card"><div class="empty"><b>No program yet</b>Claude writes this at the Sunday review.</div></div>';
    return;
  }
  el.innerHTML =
    `<p class="hint" style="text-align:left;margin:0 0 12px">Week of ${prog.week_of ? prettyDate(prog.week_of) : '—'}. Tap any session to open and log it, including the add-ins on an off day.</p>`
    + sessions.map(s => plainSession(s, false)).join('')
    + (addins.length ? '<div class="eyebrow" style="margin:18px 0 8px">Optional add-ins</div>' : '')
    + addins.map(s => plainSession(s, true)).join('');

  el.querySelectorAll('[data-start]').forEach(b => b.onclick = () => {
    const key = b.dataset.start;
    const all = (PROG.sessions || []).concat(PROG.optional_addins || []);
    const s = all.find(x => (x.key || x.day) === key);
    if (!s) return;
    startSession(s, false);
    showToday();
  });
}

// A stored set is either a hold or a load. Render whichever it actually is
// rather than printing "?" where the reps would have been.
function setSummary(x) {
  const rpe = x.rpe ? ' @' + x.rpe : '';
  if (x.duration_s != null) return `${x.duration_s}s${rpe}`;
  return `${x.weight_lb ? x.weight_lb + '×' : ''}${x.reps != null ? x.reps : '?'}${rpe}`;
}

function renderPast() {
  const el = document.getElementById('pastlist');
  if (!HISTORY.length) {
    el.innerHTML = '<div class="card"><div class="empty"><b>No sessions logged yet</b>Finish a workout, copy the results, and paste them to Claude.</div></div>';
    return;
  }
  const sorted = HISTORY.slice().sort((a, b) => String(b.date).localeCompare(String(a.date)));
  el.innerHTML = sorted.map(s => {
    if (s.feel === 'skipped' || !(s.exercises || []).length) {
      return `<div class="card"><div class="eyebrow">${esc(prettyDate(s.date))}</div>
        <h2 style="margin:5px 0 0;font-size:15px">${esc(s.title || 'Session')} <span class="flag">skipped</span></h2></div>`;
    }
    const rows = s.exercises.map(e => {
      const sets = (e.sets || []).map(setSummary).join('   ');
      return `<div class="plain"><b>${esc(e.name)}</b><u>${esc(sets)}</u></div>`;
    }).join('');
    const vol = s.exercises.reduce((a, e) => a + (e.sets || []).length, 0);
    return `<div class="card">
      <div class="eyebrow"><span>${esc(prettyDate(s.date))}</span></div>
      <h2 style="margin:5px 0 6px;font-size:15px">${esc(s.title || 'Session')}</h2>
      <div class="delta" style="margin-bottom:6px">${vol} sets · felt <b>${esc(s.feel || 'ok')}</b></div>
      ${rows}
      ${s.notes ? `<div class="sugg" style="margin-top:10px">${esc(s.notes)}</div>` : ''}
    </div>`;
  }).join('');
}

// ---------- boot ----------
(async function () {
  const now = new Date();
  document.getElementById('today').textContent = prettyDate(isoDate(now));
  sweepWip();
  loadRatings();

  const prevMonth = new Date(now);
  prevMonth.setMonth(prevMonth.getMonth() - 1);

  const [prog, thisM, lastM, prefs] = await Promise.all([
    load('data/workouts/program.json', {}),
    load(`data/workouts/log-${monthKey(now)}.json`, { sessions: [] }),
    load(`data/workouts/log-${monthKey(prevMonth)}.json`, { sessions: [] }),
    load('data/preferences/exercises.json', { favorites: [], disliked: [] })
  ]);

  PROG    = prog;
  HISTORY = [].concat(thisM.sessions || [], lastM.sessions || []);
  (prefs.favorites || []).forEach(n => ON_FILE[n] = 'favorite');
  (prefs.disliked  || []).forEach(n => ON_FILE[n] = 'disliked');

  const dayName  = now.toLocaleDateString('en-US', { weekday: 'short' });
  const sessions = prog.sessions || [];
  let s = sessions.find(x => x.day === dayName);
  let offDay = false;

  // Something half-logged today wins over whatever the calendar says. Coming
  // back to the page mid-workout should land you back in that workout.
  const all = sessions.concat(prog.optional_addins || []);
  const pending = all.find(x => wipExists(x.key || x.day));
  if (pending) { s = pending; offDay = false; }

  // Not a lift day. Show the next one up rather than an empty screen, and say so.
  if (!s && sessions.length) {
    const order = ['Sun', 'Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat'];
    for (let i = 1; i <= 7 && !s; i++) {
      const d = order[(now.getDay() + i) % 7];
      s = sessions.find(x => x.day === d);
    }
    offDay = true;
  }

  renderPast();

  if (!s) {
    document.getElementById('title').textContent = 'No program yet';
    document.getElementById('session').innerHTML =
      '<div class="card"><div class="empty"><b>Nothing scheduled</b>Claude writes the week at the Sunday review.</div></div>';
    document.getElementById('feelcard').style.display = 'none';
    document.getElementById('notecard').style.display = 'none';
    document.getElementById('copy').style.display = 'none';
    renderWeek(prog);
    return;
  }

  startSession(s, offDay);
})();
</script>
