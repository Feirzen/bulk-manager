<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Month in Review</title>
<link rel="icon" href="assets/icon.svg" type="image/svg+xml">
<link rel="icon" href="assets/favicon-32.png" sizes="32x32">
<link rel="apple-touch-icon" href="assets/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/app.css">
<script src="assets/theme.js"></script>
<style>
  .hrow{display:flex;justify-content:space-between;align-items:center;gap:10px}
  .monthpick{display:flex;align-items:center;gap:8px;margin:10px 0 16px}
  .monthpick button{
    width:34px;height:34px;flex:none;border:1px solid var(--rule);border-radius:8px;
    background:var(--card);color:var(--ink-2);cursor:pointer;font-size:12px;
  }
  .monthpick button:disabled{opacity:.3;cursor:default}
  .monthpick .m{flex:1;text-align:center;font-family:'IBM Plex Mono',monospace;font-size:12px;
    letter-spacing:.12em;text-transform:uppercase;color:var(--ink-2)}

  .hero{text-align:center;padding:24px 16px 20px;border-top:3px solid var(--signal)}
  .hero .big{font-family:'IBM Plex Mono',monospace;font-size:52px;font-weight:600;line-height:1;
    letter-spacing:-.03em;color:var(--signal)}
  .hero .lbl{font-family:'IBM Plex Mono',monospace;font-size:10px;letter-spacing:.14em;
    text-transform:uppercase;color:var(--ink-3);margin-top:8px}
  .hero p{font-size:14px;color:var(--ink);margin-top:14px;line-height:1.5}

  .tiles{display:grid;grid-template-columns:1fr 1fr;gap:1px;background:var(--rule);
    border:1px solid var(--rule);border-radius:var(--r);overflow:hidden;margin-bottom:12px}
  .tiles div{background:var(--card);padding:13px 12px}
  .tiles .num{display:block;font-size:22px;margin-top:4px}
  .tiles small{display:block;font-size:11px;color:var(--ink-2);margin-top:2px}

  .callout{border-left:3px solid var(--signal)}
  .callout.fix{border-left-color:var(--burn)}
  .callout.win{border-left-color:var(--protein)}
  .callout p{font-size:13.5px;line-height:1.5}
  .callout ul{margin:6px 0 0 17px;font-size:13.5px;line-height:1.5}
  .callout li{margin-bottom:6px}
  .callout li:last-child{margin-bottom:0}

  /* lift-day calendar */
  .cal{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;margin-top:4px}
  .cal .dn{font-family:'IBM Plex Mono',monospace;font-size:9px;color:var(--ink-3);text-align:center;padding-bottom:2px}
  .cal .d{aspect-ratio:1;border-radius:6px;display:flex;align-items:center;justify-content:center;
    font-family:'IBM Plex Mono',monospace;font-size:10.5px;color:var(--ink-3);background:var(--track);opacity:.45}
  .cal .d.lift{opacity:1;border:1.5px dashed var(--ink-3);background:none}
  .cal .d.hit{opacity:1;background:var(--signal);color:var(--paper);font-weight:600;border:0}
  .cal .d.extra{opacity:1;background:none;border:1.5px solid var(--signal);color:var(--signal)}
  .cal .d.future{opacity:.25}
  .legend{display:flex;flex-wrap:wrap;gap:12px;margin-top:10px;font-family:'IBM Plex Mono',monospace;
    font-size:9px;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-3)}
  .legend i{display:inline-block;width:10px;height:10px;border-radius:3px;vertical-align:-1px;margin-right:5px}

  table.lifts{width:100%;border-collapse:collapse;font-size:12.5px}
  table.lifts th{font-family:'IBM Plex Mono',monospace;font-size:9px;letter-spacing:.1em;text-transform:uppercase;
    color:var(--ink-3);font-weight:500;text-align:left;padding:0 6px 7px 0;border-bottom:1px solid var(--rule)}
  table.lifts td{padding:9px 6px 9px 0;border-bottom:1px solid var(--rule);vertical-align:top}
  table.lifts tr:last-child td{border-bottom:0}
  table.lifts td.n{font-family:'IBM Plex Mono',monospace;white-space:nowrap}
  table.lifts td.up{color:var(--protein);font-weight:600}
  table.lifts td.down{color:var(--over);font-weight:600}

  details.sec{padding:0}
  details.sec > summary{list-style:none;cursor:pointer;padding:14px 16px;display:flex;justify-content:space-between;align-items:center}
  details.sec > summary::-webkit-details-marker{display:none}
  details.sec > summary b{font-size:13px;font-weight:600}
  details.sec > summary span{color:var(--ink-3);font-size:11px}
  details.sec[open] > summary span{transform:rotate(180deg)}
  .secbody{padding:0 16px 16px;font-size:13px;line-height:1.55;color:var(--ink-2)}
  .secbody p + p{margin-top:9px}
  .secbody b{color:var(--ink)}
  .gaps{font-size:11.5px;color:var(--ink-3);line-height:1.5;margin:4px 2px 14px}
  .md{font-size:13.5px;line-height:1.55}
  .md h1{display:none}
  .md h2{font-size:14px;margin:18px 0 8px}
  .md p,.md ul,.md table{margin-bottom:10px}
  .md ul{margin-left:18px}
  .md table{border-collapse:collapse;width:100%;font-size:12px}
  .md td,.md th{border-bottom:1px solid var(--rule);padding:5px 6px 5px 0;text-align:left}
  .md code{font-family:'IBM Plex Mono',monospace;font-size:11.5px}
</style>
</head>
<body>

<div class="wrap">
  <header style="display:block;margin-bottom:0">
    <div class="hrow">
      <h1>Month in review</h1>
      <span class="date" id="today"></span>
    </div>
    <div class="monthpick">
      <button id="prev" aria-label="Previous month">&#9664;</button>
      <span class="m" id="mlabel">&mdash;</span>
      <button id="next" aria-label="Next month">&#9654;</button>
    </div>
  </header>
  <div id="out"><div class="card"><div class="empty"><b>Loading</b></div></div></div>
</div>

<nav>
  <a href="index.html">Today</a>
  <a href="index.html#log">Log</a>
  <a href="workout.html">Workout</a>
  <a href="review.html" class="on">Review</a>
</nav>

<script src="assets/data.js"></script>
<script>
const esc = s => String(s == null ? '' : s)
  .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
// **bold** is the only markup the review text uses.
const rich = s => esc(s).replace(/\*\*(.+?)\*\*/g, '<b>$1</b>');
const paras = s => String(s || '').split(/\n\s*\n/).map(p => `<p>${rich(p.trim())}</p>`).join('');
const css = v => getComputedStyle(document.documentElement).getPropertyValue(v).trim();

const FIRST = '2026-08';
function shiftMonth(m, n) {
  const [y, mo] = m.split('-').map(Number);
  const d = new Date(y, mo - 1 + n, 1);
  return monthKey(d);
}
const lastFull = () => shiftMonth(monthKey(new Date()), -1);
const monthName = m => {
  const [y, mo] = m.split('-').map(Number);
  return new Date(y, mo - 1, 1).toLocaleDateString(undefined, { month: 'long', year: 'numeric' });
};

async function loadText(path) {
  try {
    const r = await fetch(RAW + path + '?t=' + Date.now(), { cache: 'no-store' });
    return r.ok ? r.text() : null;
  } catch (e) { return null; }
}

// ---------- lift-day calendar, built from the raw log ----------
function calendar(m, sessions, liftDays) {
  const [y, mo] = m.split('-').map(Number);
  const first = new Date(y, mo - 1, 1);
  const days = new Date(y, mo, 0).getDate();
  const names = ['Sun', 'Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat'];
  const done = new Set(sessions.filter(s => s.feel !== 'skipped' && (s.exercises || []).length).map(s => s.date));
  const today = isoDate(new Date());
  const lead = (first.getDay() + 6) % 7;   // Monday-first grid

  let cells = ['M', 'T', 'W', 'T', 'F', 'S', 'S'].map(d => `<div class="dn">${d}</div>`).join('');
  cells += '<div></div>'.repeat(lead);
  let hit = 0, sched = 0;
  for (let d = 1; d <= days; d++) {
    const date = new Date(y, mo - 1, d);
    const iso = isoDate(date);
    const isLift = liftDays.includes(names[date.getDay()]);
    const did = done.has(iso);
    let cls = 'd';
    if (iso > today) cls += ' future';
    else if (isLift && did) { cls += ' hit'; hit++; sched++; }
    else if (isLift) { cls += ' lift'; sched++; }
    else if (did) cls += ' extra';
    cells += `<div class="${cls}">${d}</div>`;
  }
  return `<div class="card">
    <h2 style="margin-bottom:8px">Lift days</h2>
    <div class="cal">${cells}</div>
    <div class="legend">
      <span><i style="background:${css('--signal')}"></i>Hit</span>
      <span><i style="border:1.5px dashed ${css('--ink-3')}"></i>Missed</span>
      <span><i style="border:1.5px solid ${css('--signal')}"></i>Extra day</span>
    </div>
    <div class="delta" style="margin-top:9px"><b>${hit} of ${sched}</b> scheduled lift days.</div>
  </div>`;
}

// ---------- weight, both sources merged, typed entries win ----------
async function weightCard(m) {
  const [y, mo] = m.split('-').map(Number);
  const days = new Date(y, mo, 0).getDate();
  const meas = await load('data/body/measurements.json', { weights: [] });
  const health = await Promise.all([...Array(days)].map((_, i) =>
    load(`data/health/${m}-${String(i + 1).padStart(2, '0')}.json`)));
  const by = {};
  health.filter(h => h && h.body_mass_lb > 0).forEach(h => by[h.date] = h.body_mass_lb);
  (meas.weights || []).filter(w => w.date && w.date.startsWith(m) && w.lb > 0).forEach(w => by[w.date] = w.lb);
  const pts = Object.keys(by).sort().map(d => ({ d, lb: by[d] }));
  const steps = health.filter(h => h && h.steps > 0);

  let chart;
  if (pts.length < 2) {
    chart = `<div class="empty" style="padding:14px 8px"><b>${pts.length ? 'One weigh-in' : 'No weigh-ins'}</b>Two or more and the line draws itself here.</div>`;
  } else {
    const W = 320, H = 100, P = 30;
    const lo = Math.min(...pts.map(p => p.lb)) - 0.5, hi = Math.max(...pts.map(p => p.lb)) + 0.5;
    const x = d => P + ((+d.slice(8) - 1) / Math.max(days - 1, 1)) * (W - P - 6);
    const yy = v => H - 16 - ((v - lo) / (hi - lo)) * (H - 28);
    let s = `<svg class="chart" viewBox="0 0 ${W} ${H}">`;
    [hi, lo].forEach(v => {
      s += `<line x1="${P}" y1="${yy(v)}" x2="${W - 6}" y2="${yy(v)}" stroke="${css('--rule')}" stroke-width=".5"/>`;
      s += `<text x="${P - 5}" y="${yy(v) + 3}" font-family="IBM Plex Mono,monospace" font-size="8" fill="${css('--ink-3')}" text-anchor="end">${v.toFixed(1)}</text>`;
    });
    s += `<polyline points="${pts.map(p => `${x(p.d)},${yy(p.lb)}`).join(' ')}" fill="none" stroke="${css('--signal')}" stroke-width="2" stroke-linejoin="round"/>`;
    pts.forEach(p => { s += `<circle cx="${x(p.d)}" cy="${yy(p.lb)}" r="2.6" fill="${css('--signal')}"/>`; });
    s += '</svg>';
    const ch = pts[pts.length - 1].lb - pts[0].lb;
    chart = s + `<div class="delta" style="margin-top:7px"><b>${pts[0].lb} → ${pts[pts.length - 1].lb} lb</b>, ${ch >= 0 ? '+' : ''}${ch.toFixed(1)} across ${pts.length} weigh-ins.</div>`;
  }
  const avgSteps = steps.length ? Math.round(steps.reduce((a, h) => a + h.steps, 0) / steps.length) : null;
  return `<div class="card">
    <h2 style="margin-bottom:8px">Weight</h2>${chart}
    <div class="delta" style="margin-top:6px">Watch sync: <b>${steps.length} of ${days}</b> days${avgSteps ? `, averaging <b>${avgSteps.toLocaleString()}</b> steps` : ''}.</div>
  </div>`;
}

function liftsTable(lifts) {
  if (!lifts || !lifts.length) return '';
  const rows = lifts.map(l => {
    const up = /^\+/.test(l.change || ''), down = /^-/.test(l.change || '');
    return `<tr><td>${esc(l.name)}</td><td class="n">${esc(l.from || '')}</td><td class="n">${esc(l.to || '')}</td>
      <td class="n ${up ? 'up' : down ? 'down' : ''}">${esc(l.change || '')}</td></tr>`;
  }).join('');
  return `<div class="card"><h2>Lifts</h2>
    <table class="lifts"><tr><th>Exercise</th><th>Start</th><th>End</th><th>Change</th></tr>${rows}</table></div>`;
}

async function render(m) {
  const out = document.getElementById('out');
  document.getElementById('mlabel').textContent = monthName(m);
  document.getElementById('prev').disabled = m <= FIRST;
  document.getElementById('next').disabled = m >= lastFull();
  history.replaceState(null, '', '?m=' + m);
  out.innerHTML = '<div class="card"><div class="empty"><b>Loading</b></div></div>';

  const [rev, md, log, config] = await Promise.all([
    load(`data/reviews/monthly-${m}.json`),
    loadText(`data/reviews/monthly-${m}.md`),
    load(`data/workouts/log-${m}.json`, { sessions: [] }),
    load('config.json', {})
  ]);
  const lift = ((config.schedule || {}).lift) || ['Mon', 'Wed', 'Fri'];
  const cal = calendar(m, log.sessions || [], lift);
  const wt = await weightCard(m);

  if (rev) {
    out.innerHTML = `
      <div class="card hero">
        <div class="big">${esc(rev.headline && rev.headline.value)}</div>
        <div class="lbl">${esc(rev.headline && rev.headline.label)}</div>
        ${rev.headline && rev.headline.line ? `<p>${rich(rev.headline.line)}</p>` : ''}
      </div>
      ${(rev.tiles || []).length ? `<div class="tiles">${rev.tiles.map(t =>
        `<div><span class="eyebrow">${esc(t.label)}</span><span class="num">${esc(t.value)}</span>${t.sub ? `<small>${esc(t.sub)}</small>` : ''}</div>`).join('')}</div>` : ''}
      ${(rev.wins || []).length ? `<div class="card callout win"><h2 style="margin-bottom:4px">What went right</h2><ul>${rev.wins.map(w => `<li>${rich(w)}</li>`).join('')}</ul></div>` : ''}
      ${rev.fix ? `<div class="card callout fix"><h2 style="margin-bottom:4px">One thing to fix</h2><p>${rich(rev.fix)}</p></div>` : ''}
      ${rev.focus ? `<div class="card callout"><h2 style="margin-bottom:4px">${esc(monthName(shiftMonth(m, 1)).split(' ')[0])} focus</h2><p>${rich(rev.focus)}</p></div>` : ''}
      ${cal}
      ${liftsTable(rev.lifts)}
      ${wt}
      ${(rev.sections || []).map(s => `<details class="card sec"><summary><b>${esc(s.title)}</b><span>&#9660;</span></summary><div class="secbody">${paras(s.body)}</div></details>`).join('')}
      ${(rev.gaps || []).length ? `<p class="gaps">Data gaps: ${rev.gaps.map(esc).join(' · ')}</p>` : ''}
      <p class="gaps">Generated ${esc((rev.generated_at || '').slice(0, 10))} by the monthly review.</p>`;
  } else if (md) {
    // Older months were written before the structured format existed.
    out.innerHTML = `${cal}${wt}<div class="card md" id="md"></div>`;
    const el = document.getElementById('md');
    el.innerHTML = paras(md);
    try {
      if (!window.marked) await new Promise((ok, bad) => {
        const s = document.createElement('script');
        s.src = 'https://cdnjs.cloudflare.com/ajax/libs/marked/12.0.2/marked.min.js';
        s.onload = ok; s.onerror = bad;
        document.head.appendChild(s);
      });
      el.innerHTML = marked.parse(md);
    } catch (e) { /* plain paragraphs stay */ }
  } else {
    out.innerHTML = `${cal}${wt}<div class="card"><div class="empty"><b>No review yet</b>The monthly review writes this on the 2nd of the next month.</div></div>`;
  }
}

document.getElementById('today').textContent = prettyDate(isoDate(new Date()));
let CUR = new URLSearchParams(location.search).get('m') || lastFull();
if (!/^\d{4}-\d{2}$/.test(CUR)) CUR = lastFull();
document.getElementById('prev').onclick = () => { CUR = shiftMonth(CUR, -1); render(CUR); };
document.getElementById('next').onclick = () => { CUR = shiftMonth(CUR, 1); render(CUR); };
render(CUR);
</script>
</body>
</html>
